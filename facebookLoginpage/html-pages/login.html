<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ui of Facebook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css-pages/login.css">
</head>

<body>
    <div id="container">
        <div id="left-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
                id="fb-smell-logo">
            <h1>Explore <br> the <br> things<br> <span id="text-blue">you love</span> </h1>
            <img src="https://static.xx.fbcdn.net/rsrc.php/y0/r/U45qBJmWVHU.webp" id="main-img">
        </div>
        <!-- right box -->
        <div id="right-box">
            <h1>Log in to Facebook</h1>
            <form id="boxex">
                <input type="email" placeholder="Email Address And mobile Number" id="email">
                <input type="password" placeholder="password" id="password">
                <button id="log-in">Log in</button>
                <a href="" id="forgt-btn">forgotton password?</a>
                <!-- <button id="creat-btn">Create New Account</button> -->
                <a href="../html-pages/signup.html" id="creat-btn">Create new Account</a>
                <div id="meta-logo">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnYlTHzIzf76dQP44xDtvT3fRI3c9C7B5DFVs8TgKXafimXRbehr-5pmE&s=10"
                        alt="">Meta
                </div>
            </form>

        </div>
    </div>
</body>

</html>
